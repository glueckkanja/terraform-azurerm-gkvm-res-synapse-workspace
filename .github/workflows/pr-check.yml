---
name: PR Check
on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']
  merge_group:
  workflow_dispatch:

# Deny everything at the workflow level; each job grants only what it needs.
permissions: {}

concurrency:
  group: pr-check-${{ github.event.pull_request.head.repo.full_name }}/${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: check for fork
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: checking for fork
        shell: pwsh
        # The flag is passed through the environment rather than interpolated
        # into the script body, so the expression can never become code.
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          $isFork = $env:IS_FORK
          if($isFork -eq "true") {
            echo "### WARNING: This workflow is disabled for forked repositories. Please follow the [release branch process](https://azure.github.io/Azure-Verified-Modules/contributing/terraform/terraform-contribution-flow/#5-create-a-pull-request-to-the-upstream-repository) if end to end tests are required." >> $env:GITHUB_STEP_SUMMARY
          }

  # Azure/avm-terraform-governance was archived on 2026-08-11 and the
  # Azure/terraform-azurerm-avm-template composite actions and reusable
  # workflows no longer exist, so the lint, format and docs checks are driven
  # directly from the composite actions vendored in this repository.
  docs:
    if: github.event.pull_request.head.repo.fork == false
    name: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to check out the module sources.
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: check docs
        uses: $/.github/actions/docs-check

  terraform:
    if: github.event.pull_request.head.repo.fork == false
    name: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to check out the module sources.
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: lint terraform
        uses: $/.github/actions/linting
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  avmfix:
    if: github.event.pull_request.head.repo.fork == false
    name: avmfix
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to check out the module sources.
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: avmfix
        uses: $/.github/actions/avmfix

  prcheckcomplete:
    name: PR check complete
    needs: [docs, terraform, avmfix]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo "All PR checks passed"
